  <line x1="80" y1="500" x2="1120" y2="500" stroke="#1F2937" stroke-width="2" />

  <text x="80" y="560" font-family="JetBrains Mono, monospace" font-size="22" fill="#3FDCFF">SERVICENOW</text>
  <text x="300" y="560" font-family="JetBrains Mono, monospace" font-size="22" fill="#3FDCFF">HALOITSM</text>
  <text x="500" y="560" font-family="JetBrains Mono, monospace" font-size="22" fill="#3FDCFF">REACT</text>
  <text x="660" y="560" font-family="JetBrains Mono, monospace" font-size="22" fill="#3FDCFF">NODE.JS</text>
