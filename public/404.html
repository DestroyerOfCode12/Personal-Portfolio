<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>404 — Jacob Mkhwanazi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0a0e14;
        background-image:
          linear-gradient(to right, rgba(63, 220, 255, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(63, 220, 255, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        color: #e6edf3;
        font-family: 'IBM Plex Sans', sans-serif;
      }
      .panel {
        border: 1px solid #1f2937;
        background: #111722;
        padding: 3rem 3.5rem;
        max-width: 32rem;
        text-align: left;
      }
      .status {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        color: #ffb454;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 2.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #8b98a8;
        line-height: 1.6;
        margin: 0 0 2rem;
      }
      a {
        display: inline-block;
        border: 1px solid rgba(63, 220, 255, 0.4);
        background: rgba(63, 220, 255, 0.1);
        color: #3fdcff;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none;
        padding: 0.75rem 1.25rem;
      }
      a:hover,
      a:focus-visible {
        background: rgba(63, 220, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <p class="status">STATUS://404 — ROUTE NOT FOUND</p>
      <h1>Page not found</h1>
      <p>The path you requested doesn't exist on this system. It may have moved, or never existed.</p>
      <a href="/">Return to home</a>
    </main>
  </body>
</html>
